services:
  app:
    build: .
    container_name: visor-app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: "1"
    depends_on:
      - db
    extra_hosts:
      - "host.docker.internal:host-gateway"
  node:
    image: node:22.13.0-alpine
    container_name: visor-node
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    # HMR robusto en Windows/WSL2 (polling)
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      # Opcional: fuerza intervalo de polling (ms)
      # VITE_FS_POLLING: "100"
    command: sh -lc "npm ci || npm install && npm run dev -- --host --strictPort --port 5173"
    ports:
      - "5173:5173"
    depends_on:
      - app
  web:
    image: nginx:alpine
    container_name: visor-web
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
  db:
    image: mysql:8.0
    container_name: visor-db
    environment:
      MYSQL_DATABASE: visorstls
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
volumes:
  dbdata: